[workspace]
resolver = "3"
members = [
    "crates/bake",
    "crates/bake-rl",
    "crates/bake-rl-macros",
    ]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Hyoung Joon, Kim"]
license = "MIT"
repository = "https://github.com/joonjoon0425/bake"

[workspace.dependencies]
bake = { path = "crates/bake" }
bake-rl-macros = { path = "crates/bake-rl-macros" }
bake-rl = { path = "crates/bake-rl" }
ndarray = "0.17.2"

burn = { version = "0.23.0-pre.1", features = ["flex", "linalg"] }
rand = "0.10.2"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
numpy = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
