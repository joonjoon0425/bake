[workspace]
resolver = "3"
members = [
    "crates/*",
    "crates/bake-rl",
    "crates/bake-rl/src/*"
    ]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Hyoung Joon, Kim"]
license = "MIT"
repository = "https://github.com/joonjoon0425/bake"

[workspace.dependencies]
bake = { path = "crates/bake" }
bake-common = { path = "crates/bake-common" }
bake-macros = { path = "crates/bake-macros" }
bake-rl = { path = "crates/bake-rl", default-features = false }
bake-rl-deep = { path = "crates/bake-rl/src/deep" }
bake-rl-tabular = { path = "crates/bake-rl/src/tabular" }
bake-rl-env = { path = "crates/bake-rl/src/env" }
bake-rl-env-gym = { path = "crates/bake-rl/src/gym" }
bake-rl-core = { path = "crates/bake-rl/src/core" }

burn = { version = "0.22.0-pre.4", features = ["flex", "linalg"] }
rand = "0.10.2"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
numpy = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"
