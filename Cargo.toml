[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
edition = "2024"
authors = ["Hyoung Joon, Kim"]
license = "MIT"
repository = "https://github.com/joonjoon0425/bake"

[workspace.dependencies]
bake-common = { path = "crates/bake-common" }
bake-deep = { path = "crates/bake-deep" }
bake-tabular = { path = "crates/bake-tabular" }
bake-macros = { path = "crates/bake-macros" }
bake-gym = { path = "crates/bake-gym" }
burn = { version = "0.22.0-pre.4", features = ["flex", "linalg"] }
rand = "0.10.2"
pyo3 = { version = "0.29.2", features = ["auto-initialize"] }
numpy = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"