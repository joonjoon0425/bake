[package]
name = "bake-rl"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
burn = { workspace = true, optional = true }
ndarray = { workspace = true }
numpy = { workspace = true, optional = true }
pyo3 = { workspace = true, optional = true }
rand.workspace = true

bake-common.workspace = true
bake-macros = { workspace = true, optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29.2", optional = true }

[features]
deep = ["dep:burn", "dep:bake-macros"]
gym = ["dep:pyo3", "dep:pyo3-build-config", "dep:numpy"]