path = "examples/deep/a2c.rs"
required-features = ["deep"]

[[example]]
name = "equivariant_a2c"
path = "examples/deep/equivariant_a2c.rs"
required-features = ["deep"]

[[example]]
name = "augmented_dqn"
path = "examples/deep/augmented_dqn.rs"
required-features = ["deep"]

[[example]]
name = "ddqn"
path = "examples/deep/ddqn.rs"
required-features = ["deep"]

[[example]]
name = "ppo"
path = "examples/deep/ppo.rs"
required-features = ["deep"]

[[example]]
name = "equivariant_ppo"
path = "examples/deep/equivariant_ppo.rs"
required-features = ["deep"]