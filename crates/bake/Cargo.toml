[package]
name = "bake"
version = "0.1.0"
edition = "2024"

[dependencies]
bake-tabular = { workspace = true, optional = true }
bake-deep = { workspace = true, optional = true }

rand = "0.10.2"
burn = "0.22.0-pre.2"

[features]
default = ["tabular", "deep"]
tabular = ["dep:bake-tabular"]
deep = ["dep:bake-deep"]

[[example]]
name = "sarsa"
path = "examples/tabular/sarsa.rs"
required-features = ["tabular"]

[[example]]
name = "qlearning"
path = "examples/tabular/qlearning.rs"
required-features = ["tabular"]

[[example]]
name = "expected_sarsa"
path = "examples/tabular/expected_sarsa.rs"
required-features = ["tabular"]

[[example]]
name = "nstepsarsa"
path = "examples/tabular/nstepsarsa.rs"
required-features = ["tabular"]

[[example]]
name = "nstepqlearning"
path = "examples/tabular/nstepqlearning.rs"
required-features = ["tabular"]

[[example]]
name = "dqn"
path = "examples/deep/dqn.rs"
required-features = ["deep"]

[[example]]
name = "dueling_dqn"
path = "examples/deep/dueling_dqn.rs"
required-features = ["deep"]

[[example]]
name = "vpg"
path = "examples/deep/vpg.rs"
required-features = ["deep"]

[[example]]
